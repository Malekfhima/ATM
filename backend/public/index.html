<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATM Banking System</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <!-- Auth Section -->
      <div id="auth-section" class="section">
        <div class="card">
          <h2>Welcome to ATM Banking</h2>
          <div class="tabs">
            <button class="tab-btn active" data-tab="login">Login</button>
            <button class="tab-btn" data-tab="register">Register</button>
          </div>

          <!-- Login Form -->
          <form id="login-form" class="auth-form">
            <div class="form-group">
              <label for="login-email">Email</label>
              <input type="email" id="login-email" required />
            </div>
            <div class="form-group">
              <label for="login-password">Password</label>
              <input type="password" id="login-password" required />
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
          </form>

          <!-- Register Form -->
          <form id="register-form" class="auth-form" style="display: none">
            <div class="form-group">
              <label for="register-name">Full Name</label>
              <input type="text" id="register-name" required />
            </div>
            <div class="form-group">
              <label for="register-email">Email</label>
              <input type="email" id="register-email" required />
            </div>
            <div class="form-group">
              <label for="register-password">Password (min 6 characters)</label>
              <input
                type="password"
                id="register-password"
                minlength="6"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
          </form>
        </div>
      </div>

      <!-- ATM Section (initially hidden) -->
      <div id="atm-section" class="section" style="display: none">
        <div class="card">
          <div class="user-info">
            <span id="user-name"></span>
            <span id="account-number"></span>
            <button id="logout-btn" class="btn btn-secondary">Logout</button>
          </div>

          <div class="balance-container">
            <h3>Current Balance</h3>
            <div id="balance" class="balance-amount">$0.00</div>
          </div>

          <div class="tabs">
            <button class="tab-btn active" data-tab="deposit">Deposit</button>
            <button class="tab-btn" data-tab="withdraw">Withdraw</button>
            <button class="tab-btn" data-tab="transfer">Transfer</button>
            <button class="tab-btn" data-tab="transactions">
              Transactions
            </button>
          </div>

          <!-- Deposit Form -->
          <div id="deposit" class="tab-content active">
            <form id="deposit-form" class="transaction-form">
              <div class="form-group">
                <label for="deposit-amount">Amount</label>
                <input
                  type="number"
                  id="deposit-amount"
                  step="0.01"
                  min="0.01"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary">Deposit</button>
            </form>
          </div>

          <!-- Withdraw Form -->
          <div id="withdraw" class="tab-content">
            <form id="withdraw-form" class="transaction-form">
              <div class="form-group">
                <label for="withdraw-amount">Amount</label>
                <input
                  type="number"
                  id="withdraw-amount"
                  step="0.01"
                  min="0.01"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary">Withdraw</button>
            </form>
          </div>

          <!-- Transfer Form -->
          <div id="transfer" class="tab-content">
            <form id="transfer-form" class="transaction-form">
              <div class="form-group">
                <label for="recipient-account">Recipient Account Number</label>
                <input type="text" id="recipient-account" required />
              </div>
              <div class="form-group">
                <label for="transfer-amount">Amount</label>
                <input
                  type="number"
                  id="transfer-amount"
                  step="0.01"
                  min="0.01"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary">Transfer</button>
            </form>
          </div>

          <!-- Transactions List -->
          <div id="transactions" class="tab-content">
            <h3>Transaction History</h3>
            <div id="transactions-list" class="transactions-list">
              <!-- Transactions will be loaded here -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <script src="js/app.js"></script>
  </body>
</html>
